<?xml version="1.0" encoding="UTF-8"?>
<!--
  트레이 전용 글리프 — build/icon.svg(앱 아이콘)의 "채워진 원(reference) + 링
  원(follower)" 두 노드만 남기고 쉐브론(방향 화살표)은 뺐다. 16/22px에서
  실측(scripts/generate-icons.mjs 프리뷰 확인) 결과 쉐브론까지 넣으면 뭉개져
  두 원만으로 단순화 — 필요 요소만 남기는 축소, 재작도가 아니다(같은 모티프
  patrimony 유지). 배경 없음(transparent) — 기존 placeholder(trayIcon.ts 교체
  전 버전)도 배경 칩 없는 단색 실루엣이었다(Linux 트레이가 자체 배경을
  제공하므로).
-->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="10" cy="16" r="8" fill="#3b82f6" />
  <circle cx="23" cy="16" r="8" fill="none" stroke="#3b82f6" stroke-width="5.5" />
</svg>
